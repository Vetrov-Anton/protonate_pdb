name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # силовое поле берём из GROMACS: пакет ставится за ~30 с и даёт
      # /usr/share/gromacs/top/*.ff
      - name: Установить GROMACS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gromacs

      - name: Установить protprep
        run: python -m pip install --quiet ".[test]"

      - name: Тесты
        run: python -m pytest -q

      - name: Проверить CLI на примере
        run: |
          protonate -f examples/fragment.pdb -o /tmp/demo --ph 7.0 \
              --ff amber99sb-ildn --fix A:31:p --fix A:63:HIE
          test -s /tmp/demo/protonated.pdb
          test -s /tmp/demo/protonation_report.tsv
