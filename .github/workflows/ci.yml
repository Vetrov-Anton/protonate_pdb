name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # the force fields come from GROMACS: the package installs in ~30 s
      # and provides /usr/share/gromacs/top/*.ff
      - name: Install GROMACS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gromacs

      - name: Install protprep
        run: python -m pip install --quiet ".[test]" nbclient nbformat ipykernel

      - name: Run tests
        run: python -m pytest -q

      - name: Run the example notebook
        run: |
          python -c "
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read('examples/protprep_demo.ipynb', as_version=4)
          NotebookClient(nb, timeout=600, kernel_name='python3',
                         resources={'metadata': {'path': 'examples'}}).execute()
          print('notebook ok')
          "

      - name: Smoke-check the CLI on the example
        run: |
          protonate -f examples/fragment.pdb -o /tmp/demo --ph 7.0 \
              --ff amber99sb-ildn --fix A:31:p --fix A:63:HIE
          test -s /tmp/demo/protonated.pdb
          test -s /tmp/demo/protonation_report.tsv
